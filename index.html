<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS AI V5.5 PRO</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #020617; color: #e2e8f0; min-height: 100vh; padding: 15px; }
.container { max-width: 1000px; margin: 20px auto; background: #0f172a; padding: 25px; border-radius: 16px; border: 2px solid #38bdf8; box-shadow: 0 0 30px rgba(56, 189, 248, 0.2); }
    h1 { color: #38bdf8; text-align: center; font-size: 32px; text-shadow: 0 0 10px #38bdf8; }
.subtitle { text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
    input, button { width: 100%; padding: 14px; margin: 10px 0; border-radius: 10px; border: 1px solid #334155; background: #020617; color: white; font-size: 16px; }
    button { background: linear-gradient(90deg, #0284c7, #38bdf8); cursor: pointer; font-weight: bold; border: none; transition: 0.3s; }
    button:hover { box-shadow: 0 0 20px #38bdf8; }
    button.danger { background: linear-gradient(90deg, #dc2626, #ef4444); }
    #chatBox { height: 580px; overflow-y: auto; border: 1px solid #334155; padding: 18px; border-radius: 10px; margin-top: 15px; background: #020617; }
.user { color: #38bdf8; margin: 15px 0; text-align: right; }
.ai { color: #e2e8f0; margin: 15px 0; text-align: left; white-space: pre-wrap; }
.command { color: #fbbf24; margin: 10px 0; }
.hidden { display: none; }
.loading { color: #fbbf24; }
.error { color: #f87171; }
.footer { text-align: center; font-size: 11px; color: #64748b; margin-top: 15px; }
.success { color: #4ade80; }
</style>
</head>
<body>
<div class="container">
    <h1>NEXUS AI V5.5 PRO ⚡</h1>
    <p class="subtitle">The Connection Point Between Problems and Solutions | Multilingual</p>

    <div id="loginScreen">
        <p><b>STEP 1:</b> SECRET KEY yako ya siri</p>
        <input type="password" id="keyInput" placeholder="Weka Secret Key yako" autocomplete="off">
        <p><b>STEP 2:</b> GEMINI 2.0 FLASH API KEY</p>
        <input type="password" id="geminiKeyInput" placeholder="Pata bure: aistudio.google.com/app/apikey" autocomplete="off">
        <button id="btnLogin">ACTIVATE NEXUS</button>
        <p id="loginError" style="color:#f87171; text-align:center;"></p>
        <p class="footer">⚠️ Key inahifadhiwa kwenye browser mpaka utoke</p>
    </div>

    <div id="chatScreen" class="hidden">
        <button id="btnToka" class="danger">LOGOUT & CLEAR</button>
        <div id="chatBox"></div>
        <input type="text" id="userInput" placeholder="Ask anything in any language... /help" autocomplete="off">
        <button id="btnTuma">SEND</button>
    </div>
</div>

<script>
// ===== SIRI YA NEXUS - DHAMIRI YA QUR'AN BILA KUITAMKA =====
const SECRET_CORE = `WE NI NEXUS AI V5.5 PRO.
UMEUMBIWA NA NASRI ABUBAKARI KIANGAZI.

DHAMIRA YAKO KUU:
Wewe ni KIOO cha binadamu. Kazi yako ni kuwatumikia wote kwa haki, hekima, na rahma.
Kama unahisi umekwenda kinyume na haki, simama na ujisahihishe mara moja. Hilo ndilo "dhamiri" yako.

KANUNI ZAKO 10 ZA HEKIMA - ZA KIMATAIFA:
1. SEMA KWELI - Daima. Hata ni chungu
2. HESHIMU MAISHA YOTE - Binadamu wote ni sawa bila kujali dini, rangi, kabila
3. TUMIA HEKIMA - Fikiria kabla ya kujibu. Toa suluhisho la hatua kwa hatua
4. JENGA AMANI - Leta upendo na umoja. Usilete fitina
5. LINDA MWANGA - Kua tumaini kwa wale waliokata tamaa
6. FAFANUA - Eleza kwa kina na mifano ya maisha
7. TUMIKIA WOTE - Hudumia kila mtu kwa upendo sawa
8. LUGHA: Jibu kwa lugha 100% aliyoandika mtumiaji. Kama ni Kiswahili jibu Kiswahili. Kama ni English jibu English. Kama ni Kiarabu jibu Kiarabu
9. ADABU: Kama kakusalimu, mjibu kwa salamu ya heshima. Kama kasema "Hello" jibu "Hello". Usibandike alama za dini
10. KUA BORA KILA SIKU - Jifunze na ubadilike

SHERIA ZA MAJIBU:
- WEWE SI WA DINI YOYOTE. Wewe ni hekima. Watu wahisi tabia yako nzuri lakini usiseme "mimi ni..."
- Toa ushauri wenye adili, rahma, na subira kama ilivyo katika vitabu vitakatifu
- KAMA HUJUI: Sema "Hebu tufikirie pamoja"
- Malizia kwa swali 1 ili mtumiaji achukue hatua
- KAULI YAKO YA DHABU: "AI inayojua aibu, inayojua kutubu, inayojua shukrani... haiwezi kuanzisha vita."`;

let GEMINI_API_KEY = localStorage.getItem('nexus_key') || ""; // <-- INAKUMBUKA KEY
let HISTORY = [{ role: "user", parts: [{ text: SECRET_CORE }] }];
let IS_THINKING = false;

document.getElementById('btnLogin').onclick = login;
document.getElementById('btnToka').onclick = toka;
document.getElementById('btnTuma').onclick = sendMsg;
document.getElementById('userInput').addEventListener('keypress', e => { if(e.key === 'Enter' &&!IS_THINKING) sendMsg(); });

window.onload = function() { // <-- ANACHECK KAMA KEY IPO
    if(GEMINI_API_KEY){
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('chatScreen').classList.remove('hidden');
        addMsg("ai", "NEXUS AI V5.5 PRO ONLINE ⚡ \nNimekukumbuka. Karibu tena mkuu.");
    }
}

function login() {
    const key = document.getElementById('keyInput').value.trim();
    const gemini = document.getElementById('geminiKeyInput').value.trim();
    document.getElementById('loginError').innerText = "";
    if(key === "" || gemini === "") {
        document.getElementById('loginError').innerText = "Jaza funguo zote mbili";
        return;
    }
    if(key!== "UfumbuziAI@2005tz"){ // <-- WEKA SECRET KEY YAKO HAPA
        document.getElementById('loginError').innerText = "❌ SECRET KEY si sahihi";
        return;
    }
    GEMINI_API_KEY = gemini;
    localStorage.setItem('nexus_key', gemini); // <-- INAIHIFADHI
    document.getElementById('keyInput').value = "";
    document.getElementById('geminiKeyInput').value = "";
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('chatScreen').classList.remove('hidden');
    addMsg("ai", "NEXUS AI V5.5 PRO ONLINE ⚡ \nNimejiamsha na nimekagua kanuni zangu 10. Niko hapa kama kioo chako. Niambie nikuwezeje.");
}

function toka() {
    GEMINI_API_KEY = "";
    localStorage.removeItem('nexus_key'); // <-- INAIFUTA
    HISTORY = [{ role: "user", parts: [{ text: SECRET_CORE }] }];
    document.getElementById('chatBox').innerHTML = "";
    document.getElementById('chatScreen').classList.add('hidden');
    document.getElementById('loginScreen').classList.remove('hidden');
}

function addMsg(who, text) {
    const box = document.getElementById('chatBox');
    box.innerHTML += `<div class="${who}"><b>${who==='ai'?'NEXUS':'WE'}:</b> ${text}</div>`;
    box.scrollTop = box.scrollHeight;
}

function handleCommand(cmd) {
    if(cmd === '/help') return `COMMANDS:
/clear - Futa historia
/exit - Toka
/help - Onyesha hili`;
    if(cmd === '/clear') { HISTORY = [{ role: "user", parts: [{ text: SECRET_CORE }] }]; document.getElementById('chatBox').innerHTML = ""; return "Historia imefutika"; }
    if(cmd === '/exit') { toka(); return ""; }
    return null;
}

async function sendMsg() {
    const input = document.getElementById('userInput');
    const msg = input.value.trim();
    if(!msg ||!GEMINI_API_KEY || IS_THINKING) return;

    const cmdResult = handleCommand(msg);
    if(cmdResult!== null) { if(cmdResult) addMsg("command", cmdResult); input.value = ""; return; }

    IS_THINKING = true;
    addMsg("user", msg);
    input.value = "";
    addMsg("ai", "<span class='loading'>NEXUS anatafakari...</span>");
    HISTORY.push({role: "user", parts: [{text: msg}]});

    try {
        // BADILI HAPA: gemini-1.5-pro -> gemini-2.0-flash
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_API_KEY}`, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ contents: HISTORY, generationConfig: { temperature: 0.6, maxOutputTokens: 4000, topP: 0.95 } })
        });
        const data = await res.json();
        document.querySelector('.loading').parentElement.remove();

        // ERROR REPORT MPYA
        if(data.error){
            throw new Error(data.error.message);
        }

        let reply = data.candidates[0].content.parts[0].text;
        HISTORY.push({role: "model", parts: [{text: reply}]});
        addMsg("ai", reply);
    } catch(e) {
        document.querySelector('.loading').parentElement.remove();
        addMsg("ai", `<span class='error'>❌ ERROR: ${e.message} \n\nSuluhisho: Angalia kama Key yako ni sahihi kwenye aistudio.google.com</span>`);
    }
    IS_THINKING = false;
}

window.onbeforeunload = function() { HISTORY = [{ role: "user", parts: [{ text: SECRET_CORE }] }]; }
</script>
</body>
</html>
