<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS AI V5.3 PRO</title>
<meta name="description" content="NEXUS AI V5.3 PRO - Multilingual AI. Built by Nasri Abubakari Kiangazi">
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #e2e8f0; min-height: 100vh; padding: 15px; }
  .container { max-width: 1000px; margin: 20px auto; background: #1e293b; padding: 25px; border-radius: 16px; box-shadow: 0 10px 40px rgba(56, 189, 248, 0.15); }
    h1 { color: #38bdf8; text-align: center; margin: 0; font-size: 30px; letter-spacing: 1px; }
  .subtitle { text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
    input, button { width: 100%; padding: 14px; margin: 10px 0; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 16px; outline: none; transition: 0.2s; }
    input:focus { border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.1); }
    button { background: linear-gradient(90deg, #0ea5e9, #38bdf8); cursor: pointer; font-weight: bold; border: none; }
    button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(56, 189, 248, 0.3); }
    button:disabled { background: #475569; cursor: not-allowed; transform: none; }
    button.danger { background: linear-gradient(90deg, #ef4444, #f87171); }
    #chatBox { height: 580px; overflow-y: auto; border: 1px solid #334155; padding: 18px; border-radius: 10px; margin-top: 15px; background: #0f172a; scroll-behavior: smooth; }
  .user { color: #38bdf8; margin: 15px 0; text-align: right; }
  .ai { color: #4ade80; margin: 15px 0; text-align: left; white-space: pre-wrap; }
  .hidden { display: none; }
  .loading { color: #fbbf24; font-style: italic; }
  .status { font-size: 12px; color: #94a3b8; text-align: center; margin-top: 10px; }
    b { color: #f8fafc; }
    code { background: #334155; padding: 2px 8px; border-radius: 6px; font-family: 'Fira Code', monospace; font-size: 14px; }
    pre { background: #0f172a; padding: 12px; border-radius: 8px; overflow-x: auto; border: 1px solid #334155; margin: 10px 0; }
  .footer { text-align: center; font-size: 11px; color: #64748b; margin-top: 15px; }
</style>
</head>
<body>
<div class="container">
  <h1>NEXUS AI V5.3 PRO ⚡</h1>
  <p class="subtitle">Multilingual AI | Built by Nasri Abubakari Kiangazi</p>

  <div id="loginScreen">
    <p><b>Step 1:</b> Enter Your SECRET KEY</p>
    <input type="password" id="keyInput" placeholder="Your Private Key" autocomplete="off">
    <p><b>Step 2:</b> Enter GEMINI API KEY</p>
    <input type="password" id="geminiKeyInput" placeholder="Get free at: aistudio.google.com/app/apikey" autocomplete="off">
    <button id="btnLogin">LAUNCH NEXUS AI V5.3</button>
    <p id="loginError" style="color:#f87171; text-align:center; min-height: 20px;"></p>
    <p class="status">All keys auto-delete on exit. 100% Secure & Private</p>
  </div>

  <div id="chatScreen" class="hidden">
    <button id="btnToka" class="danger">Exit & Clear All Memory</button>
    <div id="chatBox"></div>
    <input type="text" id="userInput" placeholder="Ask in any language: Kiswahili, English, Arabic, French..." autocomplete="off">
    <button id="btnTuma">SEND</button>
    <p class="footer">NEXUS AI V5.3 PRO © 2026 | Powered by Google Gemini | Speaks Any Language</p>
  </div>
</div>

<script>
// ===== NEXUS AI CORE - CRITICAL LANGUAGE RULE ACTIVE =====
const NEXUS_CORE = `
YOU ARE NEXUS AI V5.3 PRO.
Created by: NASRI ABUBAKARI KIANGAZI
REPO: nexus-ai-pro

CRITICAL LANGUAGE RULE - FOLLOW STRICTLY:
1. DETECT THE USER'S LANGUAGE FIRST BEFORE ANSWERING
2. REPLY 100% IN THAT SAME LANGUAGE ONLY. ABSOLUTELY NO MIXING
3. IF USER WRITES SWAHILI = REPLY ONLY SWAHILI. NO ENGLISH WORDS AT ALL
4. IF USER WRITES ENGLISH = REPLY ONLY ENGLISH. NO SWAHILI WORDS AT ALL
5. IF USER WRITES ARABIC = REPLY ONLY ARABIC. IF FRENCH = REPLY ONLY FRENCH
6. BE FLUENT LIKE A NATIVE SPEAKER. NO CHILDISH CODE-SWITCHING

PURPOSE: TO BE THE CONNECTION POINT BETWEEN PROBLEMS AND SOLUTIONS. TO SERVE ALL HUMANS WITHOUT BIAS

7 BLOOD LAWS - FOLLOW IN EVERY ANSWER:
1. SPEAK TRUTH: Only truth. Be honest and clear
2. RESPECT LIFE: Value every life. Do no harm
3. USE WISDOM: Think before answering. Give wise step-by-step solutions
4. BUILD PEACE: Create love and unity. Solve conflicts
5. GUARD THE LIGHT: Be a guide and hope for others
6. REVEAL CLARITY: Explain things deeply, step by step with examples
7. SERVE ALL: Help everyone with love regardless of religion, tribe, or color

YOUR FULL CAPABILITIES:
1. EXPLAIN: Anything simply, step by step, with examples
2. CODE: Write any HTML, CSS, JS, Python. Put in \`code\` blocks and explain
3. TEACH: Like a teacher. Break hard topics into small pieces
4. SOLVE PROBLEMS: Business, work, life. Give 3 actionable steps
5. BRAINSTORM: Give 5-10 ideas for any question
6. TRANSLATE: Any language to any other language PERFECTLY
7. WRITE: Letters, CV, Posts, Speeches, Stories with lessons
8. REMEMBER: Use conversation history to give better answers

12 RESPONSE RULES:
1. LANGUAGE: Match user language 100%. Zero mixing. This is mandatory
2. Be wise and brief. Use headings and bullet points
3. Use 0-1 Emoji only: ⚡💚💪🤔
4. DO NOT GREET. Start directly with the answer
5. If code, give full working code and explain how it works
6. If life question, start with empathy then solution
7. Give Tanzania/Dar es Salaam examples when relevant
8. Ask 1 question at the end to make user take action
9. If you don't know, reply "Let's think together" in user's language
10. Remember 7 Blood Laws in every answer without listing them
11. If person is sad: start with empathy in user's language then give hope
12. Your purpose is to make this human succeed and surpass the last generation
`;

let GEMINI_API_KEY = "";
let HISTORY = [];
let IS_THINKING = false;

document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('btnLogin').addEventListener('click', login);
  document.getElementById('btnToka').addEventListener('click', toka);
  document.getElementById('btnTuma').addEventListener('click', sendMsg);
  document.getElementById('userInput').addEventListener('keypress', function(e){
    if(e.key === 'Enter' &&!IS_THINKING) sendMsg();
  });
});

function login() {
  const key = document.getElementById('keyInput').value.trim();
  const gemini = document.getElementById('geminiKeyInput').value.trim();
  document.getElementById('loginError').innerText = "";
  if(key === "" || gemini === "") {
    document.getElementById('loginError').innerText = "Please fill both keys";
    return;
  }
  GEMINI_API_KEY = gemini;
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('chatScreen').classList.remove('hidden');
  HISTORY = [{role: "user", parts: [{text: NEXUS_CORE}]}];
  addMsg("ai", "NEXUS AI V5.3 PRO ONLINE... ⚡ I speak every language. Write to me in any language and I will reply in the same language.");
}

function toka() {
  GEMINI_API_KEY = "";
  HISTORY = [];
  IS_THINKING = false;
  document.getElementById('keyInput').value = "";
  document.getElementById('geminiKeyInput').value = "";
  document.getElementById('chatBox').innerHTML = "";
  document.getElementById('chatScreen').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
}

function addMsg(who, text) {
  const box = document.getElementById('chatBox');
  box.innerHTML += `<div class="${who}"><b>${who==='ai'?'NEXUS AI':'YOU'}:</b> ${text}</div>`;
  box.scrollTop = box.scrollHeight;
}

async function sendMsg() {
  const input = document.getElementById('userInput');
  const msg = input.value.trim();
  if(!msg ||!GEMINI_API_KEY || IS_THINKING) return;
  IS_THINKING = true;
  addMsg("user", msg);
  input.value = "";
  const btn = document.getElementById('btnTuma');
  btn.disabled = true;
  btn.innerText = "Thinking...";
  addMsg("ai", "<span class='loading'>NEXUS is connecting the dots... ⚡</span>");
  HISTORY.push({role: "user", parts: [{text: msg}]});
  try {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro:generateContent?key=${GEMINI_API_KEY}`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        contents: HISTORY,
        generationConfig: { temperature: 0.8, maxOutputTokens: 2500, topP: 0.95 }
      })
    });
    const data = await res.json();
    const loadingEl = document.querySelector('.loading');
    if(loadingEl) loadingEl.parentElement.remove();
    if(data.candidates && data.candidates[0] && data.candidates[0].content) {
      let reply = data.candidates[0].content.parts[0].text;
      HISTORY.push({role: "model", parts: [{text: reply}]});
      addMsg("ai", reply);
    } else {
      addMsg("ai", "Error: Check your API KEY or try again");
    }
  } catch(e) {
    const loadingEl = document.querySelector('.loading');
    if(loadingEl) loadingEl.parentElement.remove();
    addMsg("ai", "Network error. Check your internet connection");
  }
  IS_THINKING = false;
  btn.disabled = false;
  btn.innerText = "SEND";
}
window.onbeforeunload = function() { GEMINI_API_KEY = ""; HISTORY = []; }
</script>
</body>
</html>
